name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, do not use this form — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag, or commit SHA
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Docker image
        - Release binary
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Redact secrets, tokens, and private repository names
      render: shell
    validations:
      required: true
